; PlatformIO: v1 = mast_control_v1, v2 = mast_control_v2 (когда появится .cpp в src_V2)

[env:mast_v1]
monitor_speed = 9600
platform = atmelavr
board = nanoatmega328
framework = arduino
lib_dir = lib_V1
src_dir = src

[env:mast_v2]
monitor_speed = 9600
platform = atmelavr
board = nanoatmega328
framework = arduino
lib_dir = lib_V2
src_dir = src_V2
; lib_deps = olikraus/U8g2 @ ^2.35.0   ; раскомментировать после первой сборки OLED
